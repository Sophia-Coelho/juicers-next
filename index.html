<style>
  /* Impede UserWay de interferir dentro do FAQ */
  #faqArea.uw-ignore *,
  #faqArea *,
  .uw-ignore * {
    pointer-events: auto !important;
  }

  /* Mantém o botão flutuante do VLibras oculto; ele é aberto pelo menu próprio. */
  html body [vw] [vw-access-button],
  html body [vw] [vw-access-button].active {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }

  /* Esconde o botão padrão do UserWay ← adiciona isso */
  #userwayAccessibilityIcon,
  [id^="userway"],
  [class^="userway"],
  .__userway_button {
    display: none !important;
  }
</style>

    <div id="root"></div>
    <!-- VLibras: mantém o plugin mas sem o botão visível -->
    <div vw class="enabled">
      <div vw-access-button></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
